name: Backend CI

on:
  push:
    branches: [ "**" ]
    paths:
      - "back-end/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "back-end/**"
      - ".github/workflows/ci.yml"


jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: back-end/pom.xml

      - name: Build and test
        working-directory: back-end
        run: chmod +x mvnw && ./mvnw verify



