spring:
  sql:
    init:
      mode: never

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

app:
  # Test payments are never enabled in the production profile. Set a real provider
  # only when its verified integration is installed and configured.
  payments:
    provider: ${APP_PAYMENTS_PROVIDER:disabled}

  auth:
    password-reset:
      # The public address of this backend (https://…); invitation and reset emails link to its page.
      link-base-url: ${PASSWORD_LINK_BASE_URL:${PUBLIC_BASE_URL}}
    sms:
      # No SMS gateway is connected; never log OTPs or report SMS delivery as available.
      delivery-mode: ${SMS_DELIVERY_MODE:DISABLED}

  storage:
    floor-plans:
      # Require an explicit durable storage choice; local disk is not a safe production fallback.
      provider: ${FLOOR_PLAN_STORAGE_PROVIDER:disabled}
    menu-images:
      # Dish photos live in R2; the backend refuses to start if the R2_* values are missing.
      provider: ${MENU_IMAGE_STORAGE_PROVIDER:r2}
    r2:
      # Supply these through the deployment secret manager after rotating the exposed token.
      endpoint: ${R2_ENDPOINT:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:saporini-assets}
      public-base-url: ${R2_PUBLIC_BASE_URL:}

  security:
    trusted-proxies: ${TRUSTED_PROXIES}
    cookie:
      domain: ${COOKIE_DOMAIN}

  bootstrap:
    super-admin:
      enabled: ${BOOTSTRAP_SUPER_ADMIN_ENABLED:false}
      email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
      username: ${BOOTSTRAP_SUPER_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
      first-name: ${BOOTSTRAP_SUPER_ADMIN_FIRST_NAME:Super}
      last-name: ${BOOTSTRAP_SUPER_ADMIN_LAST_NAME:Admin}

  mail:
    from: ${MAIL_FROM}

  frontend:
    base-url: ${FRONTEND_BASE_URL}
    mobile-base-url: ${FRONTEND_MOBILE_BASE_URL:}
    universal-base-url: ${FRONTEND_UNIVERSAL_BASE_URL:}
    default-link-target: ${FRONTEND_DEFAULT_LINK_TARGET:UNIVERSAL}

  device:
    pairing:
      token-pepper: ${DEVICE_PAIRING_TOKEN_PEPPER}
      default-ttl: ${DEVICE_PAIRING_DEFAULT_TTL:15m}
      max-ttl: ${DEVICE_PAIRING_MAX_TTL:24h}
