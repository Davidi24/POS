server:
  forward-headers-strategy: none

spring:
  application:
    name: Pos
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_SMTP_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:5000}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        query:
          fail_on_pagination_over_collection_fetch: true

springdoc:
  swagger-ui:
    persist-authorization: true

security:
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    access-expiration: 15m
    refresh-expiration: 1d

app:
  restaurants:
    # Public restaurant applications (POST /restaurants/registrations), each reviewed by a super admin before the
    # restaurant exists. Off: only super admins create restaurants (applicants can still check earlier applications).
    public-registration-enabled: ${APP_PUBLIC_REGISTRATION_ENABLED:true}
    applications:
      # Applications per IP address and per owner email, and status checks per IP address, within each window.
      max-per-ip: ${APP_APPLICATIONS_MAX_PER_IP:5}
      ip-window-minutes: ${APP_APPLICATIONS_IP_WINDOW_MINUTES:60}
      max-per-email: ${APP_APPLICATIONS_MAX_PER_EMAIL:3}
      email-window-hours: ${APP_APPLICATIONS_EMAIL_WINDOW_HOURS:24}
      status-checks-per-ip: ${APP_APPLICATIONS_STATUS_CHECKS_PER_IP:30}
      status-window-minutes: ${APP_APPLICATIONS_STATUS_WINDOW_MINUTES:10}

  payments:
    # A live provider must be configured before booking money can be collected.
    provider: ${APP_PAYMENTS_PROVIDER:disabled}

  storage:
    floor-plans:
      provider: ${FLOOR_PLAN_STORAGE_PROVIDER:disabled}
    menu-images:
      # Dish photos: "r2" (Cloudflare R2, production), "local" (a folder, development) or "disabled".
      provider: ${MENU_IMAGE_STORAGE_PROVIDER:disabled}
      local-directory: ${MENU_IMAGE_LOCAL_DIRECTORY:uploads}
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:saporini-assets}
      # Optional public bucket domain (r2.dev or your own). Empty: the backend serves photos at /public/menu-images/**.
      public-base-url: ${R2_PUBLIC_BASE_URL:}

  security:
    max-user-agent-length: 512

    trusted-proxies:
      # LOCAL DEV ONLY — must be overridden in production with the real proxy IP(s)
      # (e.g. your NGINX / load-balancer IP as seen by the app)
      # Failure to update this will cause all requests to fall back to the proxy IP
      # instead of the real client IP, breaking rate limiting and audit logs.
      - 127.0.0.1
      - ::1

    login:
      max-failed-attempts: 5
      lock-duration-minutes: 15
      max-attempts-per-ip: 20
      max-attempts-per-account: 5
      window-minutes: 5
      attempt-retention-days: 90

    session:
      max-active-sessions: 3

    refresh-token:
      pepper: ${REFRESH_TOKEN_PEPPER}
      rate-limit:
        max-attempts-per-ip: 20
        window-minutes: 1

    cookie:
      access-token-name: access-token
      refresh-token-name: refreshToken
      refresh-token-path: /auth/web
      same-site: Strict
      secure: true
      domain:

  bootstrap:
    super-admin:
      enabled: false

  auth:
    password-reset:
      token-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}
      request-cooldown: ${PASSWORD_RESET_REQUEST_COOLDOWN:2m}
      token-pepper: ${PASSWORD_RESET_TOKEN_PEPPER}
      # Owners' invitations stay usable longer than reset links.
      invite-token-ttl: ${OWNER_INVITE_TOKEN_TTL:72h}
      # Emailed links open this backend's own page (/public/account/password) until a website takes over.
      link-base-url: ${PASSWORD_LINK_BASE_URL:${PUBLIC_BASE_URL:http://localhost:8080}}
      reset-path: ${PASSWORD_RESET_FRONTEND_PATH:/public/account/password}
      subject: ${PASSWORD_RESET_EMAIL_SUBJECT:Reset your POS password}

    email-verification:
      token-ttl: ${EMAIL_VERIFICATION_TOKEN_TTL:24h}
      request-cooldown: ${EMAIL_VERIFICATION_REQUEST_COOLDOWN:5m}
      token-pepper: ${EMAIL_VERIFICATION_TOKEN_PEPPER}
      verify-path: ${EMAIL_VERIFICATION_FRONTEND_PATH:/verify-email}
      subject: ${EMAIL_VERIFICATION_EMAIL_SUBJECT:Verify your POS email}

    sms:
      delivery-mode: ${SMS_DELIVERY_MODE:DISABLED}
      password-reset-code-ttl: ${SMS_PASSWORD_RESET_CODE_TTL:10m}
      phone-verification-code-ttl: ${SMS_PHONE_VERIFICATION_CODE_TTL:10m}
      request-cooldown: ${SMS_REQUEST_COOLDOWN:1m}
      code-length: ${SMS_CODE_LENGTH:6}
      max-attempts: ${SMS_MAX_ATTEMPTS:5}
      code-pepper: ${SMS_CODE_PEPPER}
      restricted-password-reset-role-codes: ${SMS_RESTRICTED_PASSWORD_RESET_ROLE_CODES:SUPER_ADMIN,OWNER}

  mail:
    from: ${MAIL_FROM:no-reply@pos.local}
    # Account emails wait here and are retried while the mail server is down.
    outbox:
      poll-ms: ${MAIL_OUTBOX_POLL_MS:5000}
      batch-size: ${MAIL_OUTBOX_BATCH_SIZE:20}
      max-attempts: ${MAIL_OUTBOX_MAX_ATTEMPTS:8}
      sending-lease: ${MAIL_OUTBOX_SENDING_LEASE:2m}
      retention: ${MAIL_OUTBOX_RETENTION:90d}

  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    mobile-base-url: ${FRONTEND_MOBILE_BASE_URL:}
    universal-base-url: ${FRONTEND_UNIVERSAL_BASE_URL:}
    default-link-target: ${FRONTEND_DEFAULT_LINK_TARGET:UNIVERSAL}

  device:
    pairing:
      token-pepper: ${DEVICE_PAIRING_TOKEN_PEPPER}
      default-ttl: ${DEVICE_PAIRING_DEFAULT_TTL:15m}
      max-ttl: ${DEVICE_PAIRING_MAX_TTL:24h}
